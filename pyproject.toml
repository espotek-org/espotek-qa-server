[project]
name = "espotek-qa"
version = "0.1.0"
description = "Automatic release QA for the EspoTek Labrador Unified App: VMs, a real board, and a results site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "httpx>=0.28",
    "waitress>=3.0",
]

[project.scripts]
qa = "espotek_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/espotek_qa"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
